<div class="dialog-backdrop">

  <div class="confirm-dialog" role="dialog" aria-modal="true">

    <div class="dialog-icon">
      !
    </div>

    <div class="dialog-content">
      <h2>{{ title }}</h2>

      <p>{{ message }}</p>
    </div>

    <div class="dialog-actions">

      <button
        type="button"
        class="cancel-button"
        (click)="onCancel()"
      >
        {{ cancelText }}
      </button>

      <button
        type="button"
        class="confirm-button"
        (click)="onConfirm()"
      >
        {{ confirmText }}
      </button>

    </div>

  </div>

</div>
